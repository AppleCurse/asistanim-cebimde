<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1216" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/statik/ikon-192.png" />
  <link rel="apple-touch-icon" href="/statik/ikon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Asistanım Cebimde</title>
  <link rel="stylesheet" href="/statik/stil.css" />
</head>
<body>
  <header>
    <h1><img src="/statik/ikon-192.png" alt="" width="28" height="28" style="border-radius:7px" /> <span class="nabiz" id="nabiz"></span> <span id="asistanAdi">Asistan</span></h1>
    <nav>
      <a href="/telefon">📞 Telefon</a>
      <a href="#" id="kur" style="display:none" title="Ana ekrana uygulama olarak kur">⬇ Kur</a>
      <a href="#" id="yenile">↻</a>
    </nav>
  </header>

  <main>
    <section class="cebi-hero" id="cebiHero">
      <div class="cebi-ust"><div><span class="cebi-kucuk">DİJİTAL VARLIĞIN</span><h2><span id="cebiAd">Cebimon</span> <span class="sinif" id="cebiSinif">Kıvılcım</span></h2><p id="cebiMesaj">Henüz yeniyim. Bana ne yapacağını öğret.</p></div><div class="cebi-yuz" id="cebiYuz">✦</div></div>
      <div class="cebi-durum"><span id="cebiMod">Hazır</span><span id="cebiCihaz">Cihaz kontrol ediliyor…</span></div>
      <div class="cebi-eylemler"><button class="cebi-aksiyon" data-ortam="genel" data-amac="Kullanıcıya bulunduğu ortamda yardımcı ol">✦ Yanımda ol</button><button class="cebi-aksiyon" data-ortam="is" data-amac="İşimi adım adım takip et">💼 İş modu</button><button class="cebi-aksiyon" data-ortam="gezi" data-amac="Bulunduğum yeri ve gördüklerimi anlamama yardım et">🧭 Gezgin modu</button></div>
    </section>

    <section class="kart">
      <h2>Yaşam belirtileri</h2>
      <div class="izgara" id="durum">
        <div class="rozet"><b>Beden</b><span>…</span></div>
      </div>
      <p class="soluk" id="agBilgi"></p>
    </section>

    <section class="kart sohbet-karti">
      <div class="baslik-satiri"><div><h2>Asistan</h2><p class="soluk alt-baslik">Ne yapmak istiyorsun?</p></div><span class="hazir-rozet">● Hazır</span></div>
      <div class="hizli-eylemler" aria-label="Hızlı işlemler">
        <button class="hizli" data-hizli="Pili, sıcaklığı ve bağlantıyı kontrol et">🔋<span>Durumu kontrol et</span></button>
        <button class="hizli" data-hizli="Etrafına bak ve önemli gördüklerini söyle">👁<span>Etrafına bak</span></button>
        <button class="hizli" data-hizli="Bugün yapmam gereken önemli işleri özetle">📋<span>Günümü özetle</span></button>
        <button class="hizli" data-hizli="Son aramaları ve mesajları özetle">📞<span>Son görüşmeler</span></button>
      </div>
      <div class="sohbet" id="sohbet"></div>
      <form class="satir" id="sohbetForm">
        <button class="mikrofon" type="button" id="mikrofon" title="Konuşarak yaz">🎙</button>
        <input id="mesaj" placeholder="Bir şey söyle veya yaz…" autocomplete="off" />
        <button class="buton birincil" type="submit" id="gonder">Gönder</button>
      </form>
      <div class="satir" style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <button class="buton" id="bak">📷 Kamera</button>
        <button class="buton" id="soyle">🔊 Telefonda seslendir</button>
        <button class="buton" id="sifirla">Sohbeti temizle</button>
      </div>
      <p class="soluk yardim" id="sesDurumu">Mikrofon düğmesine dokun, konuş; terminal gerekmez.</p>
    </section>

    <section class="kart">
      <h2>Görüşme görevleri</h2>
      <form id="gorevForm">
        <textarea id="talimat" placeholder="Örn: Diş hekimi Dr. Aylin'i ara, Perşembe 15:00 randevumu bir sonraki haftaya aynı saate al. Olmazsa sabah saatleri de olur."></textarea>
        <div class="satir" style="display:flex;gap:8px;margin-top:8px">
          <input id="numara" placeholder="Numara (isteğe bağlı, +90…)" />
          <button class="buton birincil" type="submit">Planla</button>
        </div>
      </form>
      <div id="gorevler" style="margin-top:12px"></div>
    </section>

    <section class="kart">
      <h2>Hafıza</h2>
      <pre class="soluk" id="hafiza" style="white-space:pre-wrap;max-height:30vh;overflow:auto;margin:0">…</pre>
    </section>
  </main>

  <script src="/statik/panel.js"></script>
</body>
</html>
